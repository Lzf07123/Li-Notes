<nav id="{{ nav_id }}" class="admin-nav{{ ' admin-nav--dialog' if nav_variant == 'dialog' else '' }}"
     aria-label="后台栏目" data-admin-nav>
  {% for group in nav_groups %}
  <details class="admin-nav-group" data-nav-group{% if group.expanded %} open{% endif %}>
    <summary class="admin-nav-group-label">
      <span>{{ group.label }}</span>
      <svg class="admin-nav-group-chevron" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="m6 9 6 6 6-6"></path>
      </svg>
    </summary>
    <div class="admin-nav-group-items">
      {% for item in group["items"] %}
      <a href="/{{ admin_path }}{{ item['path'] }}"
         class="admin-nav-link{{ ' active' if item['active'] else '' }}"
         {% if item["active"] %}aria-current="page"{% endif %}>
        <svg class="admin-nav-icon" aria-hidden="true"><use href="#nav-icon-{{ item["icon"] }}"></use></svg>
        <span>{{ item["label"] }}</span>
      </a>
      {% endfor %}
    </div>
  </details>
  {% endfor %}
  <p class="admin-nav-empty" data-nav-empty hidden>没有匹配的栏目，换个关键词试试。</p>
</nav>
